<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="fundo-branco">

    <section class="contato-formulario">
        
        <form action="sucesso.html" method="GET" class="form-contato">
            <label  for="nome">Nome:</label>
            <input class="input-contato" type="text" id="nome" required>
            <br><br>
            <label for="email">Email:</label>
            <input class="input-contato" type="email" required>
            <br><br>
            <label for="telefone">Telefone:</label>
            <input class="input-contato" type="number" id="telefone" required>
            <br><br>
            <input type="submit" class="btn-contato" type="button" value="Enviar">
            
        </form>
    </section>
</body>
</html>
